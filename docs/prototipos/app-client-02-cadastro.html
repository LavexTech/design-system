<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-client-02-cadastro · Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B7566}a:hover{color:#2D3B42}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#66757D;opacity:1}
input:focus-visible{outline:2px solid #0B7566;outline-offset:1px}
.pw input:focus-visible{outline:none}
.pw:focus-within{outline:2px solid #0B7566;outline-offset:1px}
button:focus-visible{outline:3px solid #2D3B42;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 1300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 56px 24px 32px; background: #FFFFFF; color: #2D3B42; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">
  <header style="display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.5px; color: #3CDBC0;">lavex</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Criar conta</h1>
      <p style="margin: 0px; font-size: 15px; line-height: 22px; color: #5A6A72; text-wrap: pretty;">Preencha seus dados para começar. Todos os campos são obrigatórios.</p>
    </div>
  </header>
  <section aria-labelledby="grupo-pessoais" style="display: flex; flex-direction: column; gap: 16px;">
    <h2 id="grupo-pessoais" style="margin: 0px; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #0B7566;">Dados pessoais</h2>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="nome" style="font-size: 14px; line-height: 20px; font-weight: 600;">Nome completo</label>
      <input id="nome" type="text" autocomplete="name" placeholder="João de Azevedo" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="cpf" style="font-size: 14px; line-height: 20px; font-weight: 600;">CPF</label>
      <input id="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="nascimento" style="font-size: 14px; line-height: 20px; font-weight: 600;">Data de nascimento</label>
      <input id="nascimento" type="text" inputmode="numeric" autocomplete="bday" placeholder="DD/MM/AAAA" aria-describedby="nascimento-ajuda" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      <span id="nascimento-ajuda" style="font-size: 13px; line-height: 18px; color: #5A6A72;">Você precisa ter 18 anos ou mais.</span>
    </div>
  </section>
  <section aria-labelledby="grupo-contato" style="display: flex; flex-direction: column; gap: 16px;">
    <h2 id="grupo-contato" style="margin: 0px; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #0B7566;">Contato</h2>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 14px; line-height: 20px; font-weight: 600;">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="voce@email.com" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="celular" style="font-size: 14px; line-height: 20px; font-weight: 600;">Celular</label>
      <input id="celular" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
  </section>
  <section aria-labelledby="grupo-acesso" style="display: flex; flex-direction: column; gap: 16px;">
    <h2 id="grupo-acesso" style="margin: 0px; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #0B7566;">Acesso</h2>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="senha" style="font-size: 14px; line-height: 20px; font-weight: 600;">Senha</label>
      <div class="pw" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0px 4px 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF;">
        <input id="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha" aria-describedby="senha-ajuda" style="flex: 1 1 0%; min-width: 0px; height: 44px; padding: 0px; border: none; background: transparent; font-size: 16px; color: #2D3B42;">
        <button type="button" aria-label="Mostrar senha" style="flex: 0 0 auto; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #2D3B42; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <span id="senha-ajuda" style="font-size: 13px; line-height: 18px; color: #5A6A72;">Use pelo menos 8 caracteres.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="confirmacao" style="font-size: 14px; line-height: 20px; font-weight: 600;">Confirmação da senha</label>
      <div class="pw" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0px 4px 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF;">
        <input id="confirmacao" type="password" autocomplete="new-password" placeholder="Repita a senha" style="flex: 1 1 0%; min-width: 0px; height: 44px; padding: 0px; border: none; background: transparent; font-size: 16px; color: #2D3B42;">
        <button type="button" aria-label="Mostrar confirmação da senha" style="flex: 0 0 auto; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #2D3B42; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>
  </section>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: #3CDBC0; color: #2D3B42; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Criar conta</button>
    <p style="margin: 0px; font-size: 13px; line-height: 20px; color: #5A6A72; text-align: center; text-wrap: pretty;">Ao criar a conta, você concorda com os <a href="#" style="font-weight: 600;">Termos de Uso</a> e a <a href="#" style="font-weight: 600;">Política de Privacidade</a>.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 0px; border-top: 1px solid #E5E1E6; padding-top: 8px;">
    <a href="#" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; text-decoration: none; color: #5A6A72;">
      <span>Já tem conta?</span>
      <span style="font-weight: 700; color: #0B7566;">Entrar</span>
    </a>
  </div>
</div>
</body>
</html>
