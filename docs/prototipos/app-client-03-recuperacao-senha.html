<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-client-03-recuperacao-senha · Esqueci minha senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B7566}a:hover{color:#2D3B42}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#66757D;opacity:1}
input:focus-visible{outline:2px solid #0B7566;outline-offset:1px}
a:focus-visible{outline:2px solid #0B7566;outline-offset:2px}
button:focus-visible{outline:3px solid #2D3B42;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #2D3B42; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">
  <header style="flex: 0 0 auto; padding: 52px 24px 0px 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="app-client-01-login.html" aria-label="Voltar para o login" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #2D3B42; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0px; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Esqueci minha senha</h1>
    </div>
    <p style="margin: 0px; padding-left: 12px; font-size: 15px; line-height: 22px; color: #5A6A72; text-wrap: pretty;">Informe o e-mail da sua conta. Enviamos um link para você criar uma nova senha.</p>
  </header>
  <main style="flex: 1 1 0%; min-height: 0px; display: flex; flex-direction: column; gap: 20px; padding: 28px 24px 16px;">
    <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 14px; line-height: 20px; font-weight: 600;">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="voce@email.com" aria-describedby="email-ajuda" value="" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      <span id="email-ajuda" style="font-size: 13px; line-height: 18px; font-weight: 400; color: #5A6A72;">
        <span class="sc-interp">A redefinição é feita só por e-mail.</span>
      </span>
    </div>
    <button type="button" style="flex: 0 0 auto; height: 56px; border: none; border-radius: 16px; background: #3CDBC0; color: #2D3B42; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Enviar link</button>
  </main>
</div>
</body>
</html>
