<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-client-42-conta-editar-endereco · Seu endereço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B7566}a:hover{color:#2D3B42}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
input{font-family:inherit}
input::placeholder{color:#66757D;opacity:1}
input:focus-visible{outline:2px solid #0B7566;outline-offset:1px}
a:focus-visible{outline:2px solid #0B7566;outline-offset:2px}
button:focus-visible{outline:3px solid #2D3B42;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #2D3B42; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">
  <header style="padding: 52px 24px 0px 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="app-client-40-conta.html" aria-label="Voltar para Minha conta" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #2D3B42; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Seu endereço</h1>
    </div>
    <p style="margin: 0px; padding-left: 12px; font-size: 15px; line-height: 22px; color: #5A6A72;">Usamos para mostrar Lavexers perto de você.</p>
  </header>
  <main style="flex: 1 1 0%; min-height: 0px; display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="cep" style="font-size: 14px; line-height: 20px; font-weight: 600;">CEP</label>
      <input id="cep" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" aria-describedby="cep-ajuda" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      <span id="cep-ajuda" style="font-size: 13px; line-height: 18px; color: #5A6A72;">Com o CEP, preenchemos rua, bairro e cidade para você.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="rua" style="font-size: 14px; line-height: 20px; font-weight: 600;">Rua</label>
      <input id="rua" type="text" autocomplete="address-line1" placeholder="Nome da rua" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: grid; grid-template-columns: 110px minmax(0px, 1fr); gap: 12px; align-items: start;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="numero" style="font-size: 14px; line-height: 20px; font-weight: 600;">Número</label>
        <input id="numero" type="text" inputmode="numeric" placeholder="123" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="complemento" style="font-size: 14px; line-height: 20px; font-weight: 600;">Complemento (opcional)</label>
        <input id="complemento" type="text" autocomplete="address-line2" placeholder="Apto, bloco, casa" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="bairro" style="font-size: 14px; line-height: 20px; font-weight: 600;">Bairro</label>
      <input id="bairro" type="text" placeholder="Seu bairro" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: grid; grid-template-columns: minmax(0px, 1fr) 88px; gap: 12px; align-items: start;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="cidade" style="font-size: 14px; line-height: 20px; font-weight: 600;">Cidade</label>
        <input id="cidade" type="text" autocomplete="address-level2" placeholder="Curitiba" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="uf" style="font-size: 14px; line-height: 20px; font-weight: 600;">Estado</label>
        <input id="uf" type="text" autocomplete="address-level1" placeholder="PR" maxlength="2" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
      </div>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #EEFBF8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B7566" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        <span style="font-size: 14px; line-height: 20px; color: #2D3B42; text-wrap: pretty;">Toque em Salvar para usar este endereço nos seus pedidos.</span>
      </div>
      <div style="display: grid; grid-template-columns: 120px minmax(0px, 1fr); gap: 12px;">
        <button type="button" disabled="" style="height: 56px; box-sizing: border-box; border: 1.5px solid #F4F2F5; border-radius: 16px; background: #F4F2F5; color: #5A6A72; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path><path d="M13.5 6.5l4 4"></path></svg>
          <span>Editar</span>
        </button>
        <button type="button" style="height: 56px; border: none; border-radius: 16px; background: #3CDBC0; color: #2D3B42; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Salvar endereço</button>
      </div>
    </div>
  </main>
  <nav aria-label="Navegação principal" style="flex: 0 0 auto; height: 76px; box-sizing: border-box; border-top: 1px solid #E5E1E6; padding: 8px 12px 0px; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; align-items: start;">
    <button type="button" style="height: 56px; border: none; background: transparent; color: #5A6A72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 500;">Pedido</span>
    </button>
    <button type="button" style="height: 56px; border: none; background: transparent; color: #5A6A72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"></path><path d="M9 8h6M9 12h6"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 500;">Histórico</span>
    </button>
    <button type="button" aria-current="page" style="height: 56px; border: none; background: transparent; color: #0B7566; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #E2FAF6; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 700;">Conta</span>
    </button>
  </nav>
</div>
</body>
</html>
