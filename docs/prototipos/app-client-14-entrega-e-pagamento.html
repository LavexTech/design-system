<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-client-14-entrega-e-pagamento · Detalhes do pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B7566}a:hover{color:#2D3B42}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
textarea{font-family:inherit}
textarea::placeholder{color:#66757D;opacity:1}
textarea:focus-visible{outline:2px solid #0B7566;outline-offset:1px}
input[type=radio]:focus-visible{outline:2px solid #0B7566;outline-offset:2px}
a:focus-visible{outline:2px solid #0B7566;outline-offset:2px}
button:focus-visible{outline:3px solid #2D3B42;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #2D3B42; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">
  <header style="flex: 0 0 auto; padding: 52px 24px 0px 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="app-client-13-add-fotos.html" aria-label="Voltar para Fotos do pedido" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #2D3B42; text-decoration: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Detalhes do pedido</h1>
    </div>
    <p style="margin: 0px; padding-left: 12px; font-size: 15px; line-height: 22px; color: #5A6A72;">Como as peças vão e voltam?</p>
  </header>
  <main style="flex: 1 1 0%; min-height: 0px; display: flex; flex-direction: column; gap: 24px; padding: 20px 24px 16px;">
    <div role="radiogroup" aria-label="Forma de coleta e entrega" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px;">
      <label style="min-height: 72px; box-sizing: border-box; padding: 12px 16px; border: 1.5px solid #869199; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer;">
        <input type="radio" name="entrega" style="flex: 0 0 auto; width: 22px; height: 22px; margin: 0px; accent-color: #0B7566;">
        <span style="flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; line-height: 22px; font-weight: 700;">Eu levo e busco</span>
          <span style="font-size: 14px; line-height: 20px; color: #5A6A72;">Sem custo de entrega.</span>
        </span>
      </label>
      <label style="min-height: 72px; box-sizing: border-box; padding: 12px 16px; border: 1.5px solid #869199; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer;">
        <input type="radio" name="entrega" style="flex: 0 0 auto; width: 22px; height: 22px; margin: 0px; accent-color: #0B7566;">
        <span style="flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; line-height: 22px; font-weight: 700;">Depende do valor</span>
          <span style="font-size: 14px; line-height: 20px; color: #5A6A72;">Quero ver o preço antes de decidir.</span>
        </span>
      </label>
      <label style="min-height: 72px; box-sizing: border-box; padding: 12px 16px; border: 1.5px solid #869199; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer;">
        <input type="radio" name="entrega" style="flex: 0 0 auto; width: 22px; height: 22px; margin: 0px; accent-color: #0B7566;">
        <span style="flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; line-height: 22px; font-weight: 700;">Quero coleta e entrega</span>
          <span style="font-size: 14px; line-height: 20px; color: #5A6A72;">A Lavexer busca e devolve as peças.</span>
        </span>
      </label>
    </div>
    <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px;">
      <label for="observacoes" style="font-size: 14px; line-height: 20px; font-weight: 600;">Observações (opcional)</label>
      <textarea id="observacoes" placeholder="Ex.: tenho alergia a amaciante" aria-describedby="observacoes-contagem" maxlength="500" style="width: 100%; height: 96px; box-sizing: border-box; padding: 14px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; line-height: 22px; color: #2D3B42; resize: none;"></textarea>
      <span id="observacoes-contagem" style="align-self: flex-end; font-size: 13px; line-height: 18px; color: #5A6A72;">
        <span class="sc-interp">0/500</span>
      </span>
    </div>
  </main>
  <div style="flex: 0 0 auto; border-top: 1px solid #E5E1E6; padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF;">
    <p style="margin: 0px; font-size: 13px; line-height: 18px; color: #5A6A72; text-align: center;">Escolha uma opção para continuar.</p>
    <button type="button" disabled="" style="height: 56px; border: none; border-radius: 16px; background: #F4F2F5; color: #5A6A72; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span>Avançar</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
  <nav aria-label="Navegação principal" style="flex: 0 0 auto; height: 76px; box-sizing: border-box; border-top: 1px solid #E5E1E6; padding: 8px 12px 0px; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; align-items: start;">
    <button type="button" aria-current="page" style="height: 56px; border: none; background: transparent; color: #0B7566; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #E2FAF6; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 700;">Pedido</span>
    </button>
    <button type="button" style="height: 56px; border: none; background: transparent; color: #5A6A72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"></path><path d="M9 8h6M9 12h6"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 500;">Histórico</span>
    </button>
    <button type="button" style="height: 56px; border: none; background: transparent; color: #5A6A72; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
      </span>
      <span style="font-size: 13px; line-height: 18px; font-weight: 500;">Conta</span>
    </button>
  </nav>
</div>
</body>
</html>
