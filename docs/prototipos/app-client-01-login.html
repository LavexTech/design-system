<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-client-01-login · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0B7566}a:hover{color:#2D3B42}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#66757D;opacity:1}
input:focus-visible{outline:2px solid #0B7566;outline-offset:1px}
.pw input:focus-visible{outline:none}
.pw:focus-within{outline:2px solid #0B7566;outline-offset:1px}
a:focus-visible{outline:2px solid #0B7566;outline-offset:2px}
button:focus-visible{outline:3px solid #2D3B42;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 72px 24px 32px; background: #FFFFFF; color: #2D3B42; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">
  <header style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center;">
    <img src="assets/logo-lavex.svg" alt="Lavex" style="width: auto; height: 124px; display: block;">
    <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <h1 style="margin: 0px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px;">Entrar</h1>
      <p style="margin: 0px; max-width: 290px; font-size: 15px; line-height: 22px; color: #5A6A72; text-wrap: pretty;">Acesse sua conta para fazer e acompanhar seus pedidos.</p>
    </div>
  </header>
  <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 14px; line-height: 20px; font-weight: 600;">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="voce@email.com" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #2D3B42;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="senha" style="font-size: 14px; line-height: 20px; font-weight: 600;">Senha</label>
      <div class="pw" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0px 4px 0px 16px; border: 1.5px solid #869199; border-radius: 12px; background: #FFFFFF;">
        <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha" style="flex: 1 1 0%; min-width: 0px; height: 44px; padding: 0px; border: none; background: transparent; font-size: 16px; color: #2D3B42;">
        <button type="button" aria-label="Mostrar senha" style="flex: 0 0 auto; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #2D3B42; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <a href="app-client-03-recuperacao-senha.html" style="align-self: flex-end; height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none; color: #0B7566;">Esqueci minha senha</a>
    </div>
  </div>
  <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: #3CDBC0; color: #2D3B42; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Entrar</button>
    <a href="app-client-02-cadastro.html" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; text-decoration: none; color: #5A6A72;">
      <span>Ainda não tem conta?</span>
      <span style="font-weight: 700; color: #0B7566;">Criar conta</span>
    </a>
  </div>
</div>
</body>
</html>
