<!doctype html>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0F2E2C; font-family: &quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;">

      </div>
    </section>
    <section aria-label="Como funciona" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 16px; background: #F3FAFA;">
      <h3 style="margin: 0px; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #08706D;">Como funciona</h3>

          <span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 14px; background: #0ABAB5; color: #0F2E2C; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</span>
          <span style="font-size: 15px; line-height: 20px; font-weight: 500;">Você lista as peças do pedido</span>
        </li>
        <li style="display: flex; align-items: center; gap: 12px;">
          <span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #08706D; box-sizing: border-box; color: #08706D; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
          <span style="font-size: 15px; line-height: 20px; color: #4A6462;">Lavexers propõem o valor</span>

        <li style="display: flex; align-items: center; gap: 12px;">
          <span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #08706D; box-sizing: border-box; color: #08706D; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
          <span style="font-size: 15px; line-height: 20px; color: #4A6462;">Você escolhe a melhor proposta</span>

    </div>

  <nav aria-label="Navegação principal" style="flex: 0 0 auto; height: 76px; box-sizing: border-box; border-top: 1px solid #DCE7E6; padding: 8px 12px 0px; display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; align-items: start;">
